name: CI

# 照 autopilot-hub 模板 examples/caller-ci-standard.yml（hub#69 之后）。hub 钉在 b34560f8d398cd946f2fc3f0cd7526d336f59a01，
# 本文件里 hub 的 checkout ref、rules 的 uses: 与 hub_ref 三处必须是同一个 40 位 SHA；改本文件或换钉是 T4。
# 「CI required」是汇总任务，供主干保护设为合并前必须通过；所以本 workflow 不加路径过滤（被过滤掉的运行不会上报，PR 会一直等它）。
on:
  pull_request:
    # edited：改标题或描述时整套 CI 重跑。edited 时不许跳过任何任务：「CI required」把 skipped 当通过，
    # 跳过测试就会让改个标题把失败的 PR 变绿。
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# 同一个 PR（或同一次推送 main）只留一次运行，新事件取消前一次。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 顶层不给任何权限，每个任务按需单独放权（C8）。
permissions: {}

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # C4：macOS 用户实际在用的系统 Python（/usr/bin/python3，3.9），和一个当前版本。
          - {name: macos-system, python: ""}
          - {name: "3.13", python: "3.13"}
    defaults:
      run:
        shell: bash
    # 测试会在临时仓库里提交；关掉 runner 上 git 的后台自动维护，避免 maintenance.lock 导致的偶发失败（规范 C3）。
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: gc.auto
      GIT_CONFIG_VALUE_1: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.python != ''
        with:
          python-version: ${{ matrix.python }}
      - name: 全量检查（C2）
        env:
          MATRIX_PYTHON: ${{ matrix.python }}
        run: |
          # 系统 Python 那一行把 /usr/bin/python3（3.9）放到 PATH 最前，validate.sh 跑的就是用户在用的版本。
          if [ -z "$MATRIX_PYTHON" ]; then export PATH="/usr/bin:${PATH}"; fi
          git --version
          python3 --version
          bash scripts/validate.sh
      - name: 工作区仍然干净（C10）
        run: git diff --exit-code

  plugin-validate:
    name: plugin validate (C7)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # 所有仓库钉同一个 CLI 版本（发布至少 7 天）；要升就在各仓库一起改这里。
      CLAUDE_CODE_VERSION: "2.1.321"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 按钉住的 SHA 取 autopilot-hub（只用脚本）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haigeerlab/autopilot-hub
          ref: b34560f8d398cd946f2fc3f0cd7526d336f59a01
          path: .hub
          persist-credentials: false
      - name: 对导出副本跑 claude plugin validate --strict
        run: |
          # 对 git archive 导出的副本校验。仓库根就是插件根时，去掉根目录的 CLAUDE.md、AGENTS.md：
          # 官方命令在那里把它们当错误（规范 C7，v1.4）。
          export_dir="${RUNNER_TEMP}/plugin-export"
          mkdir -p "${export_dir}"
          git archive HEAD | tar -x -C "${export_dir}"
          if [ -f "${export_dir}/.claude-plugin/plugin.json" ]; then rm -f "${export_dir}/CLAUDE.md" "${export_dir}/AGENTS.md"; fi
          cd "${export_dir}"
          claude() { npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "$@"; }
          claude plugin validate --strict .
          python3 - <<'PY' > "${RUNNER_TEMP}/plugin-dirs.txt"
          import json, os
          data = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          for entry in data.get("plugins") or []:
              src = entry.get("source") if isinstance(entry, dict) else None
              if isinstance(src, str) and os.path.normpath(src) not in (".", ""):
                  print(os.path.normpath(src))
          PY
          while read -r dir; do claude plugin validate --strict "${dir}"; done < "${RUNNER_TEMP}/plugin-dirs.txt"
      - name: skill、command、agent 的 frontmatter 真能解析（C7）
        run: python3 -B .hub/rules/frontmatter.py --repo .

  rules:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      checks: write
      pull-requests: read
    uses: haigeerlab/autopilot-hub/.github/workflows/rules.yml@b34560f8d398cd946f2fc3f0cd7526d336f59a01
    with:
      hub_ref: b34560f8d398cd946f2fc3f0cd7526d336f59a01
      # 影子运行期间用 report；用户看过影子运行结果后再改成 enforce。
      mode: report

  ci-required:
    name: CI required
    if: always()
    needs: [test, plugin-validate, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: 每个 CI 任务都成功（skipped 表示这类事件不跑，例如推送时的 rules）
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          bad = {job: r["result"] for job, r in json.load(sys.stdin).items() if r["result"] not in ("success", "skipped")}
          print(bad or "all CI jobs succeeded")
          sys.exit(1 if bad else 0)'
