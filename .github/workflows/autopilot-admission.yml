# 照 autopilot-hub 模板 examples/caller-autopilot-admission.yml（hub b34560f）。
# uses: 与 hub_ref 两处必须是同一个 40 位 hub 提交 SHA；增改本文件是 T4：仓库所有者提交，人来合并。
name: autopilot-admission

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 插件规范 C8：顶层不给权限，每个任务按需申请。
permissions: {}

jobs:
  admission:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
    uses: haigeerlab/autopilot-hub/.github/workflows/admission.yml@b34560f8d398cd946f2fc3f0cd7526d336f59a01
    with:
      hub_ref: b34560f8d398cd946f2fc3f0cd7526d336f59a01
